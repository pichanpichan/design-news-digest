name: 设计资讯摘要

on:
  schedule:
    # 每 3 天 9:00 CST = UTC 1:00
    - cron: "0 1 */3 * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: ./design-news-digest
        run: |
          pip install --upgrade pip
          pip install Pillow feedparser

      - name: ① 发现 + 翻译 + 生成（不发送）
        working-directory: ./design-news-digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DESIGN_DIGEST_TO_ADDRS: ${{ secrets.DESIGN_DIGEST_TO_ADDRS || 'isawuonce@qq.com,isawuonce@gmail.com' }}
          DESIGN_DIGEST_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DESIGN_DIGEST_SMTP_HOST: smtp.gmail.com
          DESIGN_DIGEST_SMTP_PORT: 587
          DESIGN_DIGEST_SMTP_USER: isawuonce@gmail.com
          DESIGN_DIGEST_IMAGE_BASE_URL: "https://raw.githubusercontent.com/pichanpichan/design-news-digest/main/design-news-digest/images"
        run: |
          python3 discover_and_translate.py

      - name: ② 推送图片到公开仓库
        working-directory: ./design-news-digest
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@localhost"
          git add images/ img_cache.json img_failures.json
          git diff --cached --quiet || {
            git commit -m "auto: update images $(date +%Y-%m-%d)"
            git push
          }

      - name: ③ 等待CDN + 发送邮件（图片已在线）
        working-directory: ./design-news-digest
        env:
          DESIGN_DIGEST_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DESIGN_DIGEST_SMTP_HOST: smtp.gmail.com
          DESIGN_DIGEST_SMTP_PORT: 587
          DESIGN_DIGEST_SMTP_USER: isawuonce@gmail.com
          DESIGN_DIGEST_TO_ADDRS: ${{ secrets.DESIGN_DIGEST_TO_ADDRS || 'isawuonce@qq.com,isawuonce@gmail.com' }}
        run: |
          echo "等待30秒让CDN传播..."
          sleep 30
          python3 digest_pipeline.py --send-only
